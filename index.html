<!DOCTYPE html>
<html lang="en">

<head>
  <title>Snacks Slot Machine</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
      <h1 class="slogan">Which Snacks Do I Get Now?</h1>
    <div class="reels">
      <div class="reel1"><img src="Dango.png"></div>
      <div class="reel2"><img src="Cake.png"></div>
      <div class="reel3"><img src="Chocolate.png"></div>
    </div>
    <div class="buttons">
      <button class="minBtn">Bet 1 coins</button>
      <button class="maxBtn">Bet 10 coins</button>
    </div>
    <h2>Coins Remaining: <span class="coins"></span></h2>
  </div>

  <script type="text/javascript" src="main.js"></script>
</body>

</html>
